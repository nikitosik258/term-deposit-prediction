[project]
name = "customer-churn"
version = "0.1.0"
description = "Production-like ML service for predicting term-deposit subscriptions."
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "joblib",
    "httpx",
    "streamlit",
    "websockets>=16.1.1,<17",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    ".test-tmp*",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 1
